<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Experiences — Rochelle Chong Li Han</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Reggae+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page ─────────────────────────────────────────────────── */
    html { height: 100%; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100%;
      /* IMPORTANT: No overflow:hidden here — it clips 3D children */
      overflow-x: hidden;
    }

    /* Subtle dot grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 52px 52px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Back link ── */
    .back-link {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 5px;
      color: #555;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .back-link:hover { color: #fff; }

    /* ── Page shell ── */
    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 56px;
    }

    /* ── Heading ── */
    .hero-head {
      text-align: center;
      padding: 0 16px;
    }
    .hero-head h1 {
      font-size: clamp(2rem, 4.8vw, 3.6rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
      flex-wrap: wrap;
    }
    .sparkle-icon {
      font-style: normal;
      font-size: 0.6em;
      display: inline-block;
      animation: sparkle-pop 3s ease-in-out infinite;
    }
    @keyframes sparkle-pop {
      0%,100% { transform: scale(1) rotate(0deg);    opacity: 1; }
      48%      { transform: scale(1) rotate(0deg);    opacity: 1; }
      52%      { transform: scale(1.3) rotate(15deg); opacity: 0.5; }
      56%      { transform: scale(1) rotate(0deg);    opacity: 1; }
    }
    .gradient-word {
      background: linear-gradient(120deg, #38bdf8 10%, #818cf8 60%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      margin-top: 10px;
      color: #4a5568;
      font-size: clamp(0.8rem, 1.4vw, 0.92rem);
    }

    /* ── Dynamic description ── */
    .dynamic-desc {
      text-align: center;
      margin-top: 14px;
      height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .desc-label {
      font-family: 'Reggae One', cursive;
      font-size: 5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: #ffff;
    }
    .desc-role {
      font-family: 'Reggae One', cursive;
      font-size: 1rem;
      color: #475569;
      margin-top: 10px;
      letter-spacing: 0.02em;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    /* ════════════════════════════════════════════════════════════
       CAROUSEL — copy exactly, no changes
       IMPORTANT: No ancestor of .carousel-scene can have overflow:hidden
       IMPORTANT: preserve-3d must be on .carousel-stage only
       IMPORTANT: perspective must be on .carousel-scene only
       IMPORTANT: cards must NOT have transform-style:preserve-3d
    ════════════════════════════════════════════════════════════ */

    .experience-section {
      width: 100%;
      padding: 20px 0 80px;
      background: #000;
      overflow: visible;          /* MUST be visible, not hidden */
      position: relative;         /* anchor for backdrop + arrow buttons */
    }

    /* ── Carousel backdrop ── */
    .carousel-backdrop {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.22;
      animation: orb-drift 8s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #1a3a5c, transparent 70%);
      top: -120px;
      left: 10%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #0f2a1a, transparent 70%);
      top: -80px;
      right: 12%;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, #2a1a3a, transparent 70%);
      bottom: -60px;
      left: 42%;
      animation-delay: -5s;
    }

    @keyframes orb-drift {
      from { transform: translate(0px,  0px)  scale(1);    }
      to   { transform: translate(18px, 12px) scale(1.08); }
    }

1    .dot-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.6;
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.8) 20%,
        rgba(0,0,0,0.8) 80%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0,0,0,0.8) 20%,
        rgba(0,0,0,0.8) 80%,
        transparent 100%
      );
    }

    .carousel-scene {
      width: 100%;
      height: 460px;
      perspective: 1000px;        /* perspective on THIS element */
      perspective-origin: 50% 50%;
      overflow: visible;          /* MUST be visible */
      position: relative;
      z-index: 1;                 /* above backdrop */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carousel-stage {
      position: relative;
      width: 0px;                 /* zero width — cards anchor from center */
      height: 360px;
      transform-style: preserve-3d;  /* preserve-3d on THIS element */
    }

    .card {
      position: absolute;
      width: 400px;
      height: 380px;
      left: -200px;               /* offset by half width to center */
      top: 0;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity  0.6s cubic-bezier(0.4, 0, 0.2, 1);
      /* NO transform-style or preserve-3d on the card itself */

      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
      transition: border-color 0.4s ease, box-shadow 0.4s ease,
                  transform 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity  0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Center card gets a brighter glass edge + shadow */
    .card.active {
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 12px 48px rgba(0, 0, 0, 0.6),
        0 0 24px rgba(255, 255, 255, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .card-image {
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 15, 0.55);
      overflow: hidden;
      position: relative;
    }

    .card-image::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-info {
      height: 28%;
      background: rgba(6, 6, 6, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .card-period {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card-company {
      font-family: 'Courier New', monospace;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
      margin: 2px 0;
    }

    .card-role {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.35);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-index {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.15);
    }

    /* ── Arrow buttons — outside .carousel-scene ── */
    .carousel-prev,
    .carousel-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.2s, background 0.2s, color 0.2s;
    }
    .carousel-prev { left: 20px; }
    .carousel-next { right: 20px; }
    .carousel-prev:hover,
    .carousel-next:hover {
      border-color: rgba(56,189,248,0.45);
      background: rgba(56,189,248,0.08);
      color: #fff;
    }

    /* ════════════════════════════════════════════════════════════
       REST OF PAGE
    ════════════════════════════════════════════════════════════ */

    /* ── Dots ── */
    .dots {
      display: flex;
      gap: 5px;
      justify-content: center;
      padding: 10px 0 20px;
    }
    .dot {
      height: 4px;
      width: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.15);
      cursor: pointer;
      transition: background 0.3s, width 0.3s;
    }
    .dot.active { background: #38bdf8; width: 20px; }

    /* ── Chat bar ── */
  </style>
</head>
<body>

  <a href="index.html#resume" class="back-link">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back
  </a>

  <div class="page">

    <!-- Heading -->


    <!-- Dynamic description -->
    <div class="dynamic-desc" id="dynamicDesc">
      <div class="desc-label" id="descLabel"></div>
      <div class="desc-role"  id="descRole"></div>
    </div>

    <!--
      IMPORTANT: No ancestor of .carousel-scene can have overflow:hidden
      Arrow buttons live here, OUTSIDE .carousel-scene
    -->
    <section class="experience-section">
      <!-- Backdrop: orbs + dot grid sit behind the carousel -->
      <div class="carousel-backdrop">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="dot-grid"></div>
      </div>

      <button class="carousel-prev" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>

      <div class="carousel-scene">
        <!-- IMPORTANT: preserve-3d lives ONLY on .carousel-stage -->
        <div class="carousel-stage" id="carouselStage">
          <!-- cards injected by JS -->
        </div>
      </div>

      <button class="carousel-next" aria-label="Next">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </section>

    <!-- Dots -->
    <div class="dots" id="dots"></div>


  </div><!-- /.page -->

  <script>
    // IMPORTANT: No ancestor of .carousel-scene can have overflow:hidden
    // IMPORTANT: preserve-3d must be on .carousel-stage only
    // IMPORTANT: perspective must be on .carousel-scene only
    // IMPORTANT: cards must NOT have transform-style:preserve-3d

    /* ── Data ── */
    const CARDS = [
      { index: '#1', company: '北京',       role: 'The Forbidden City',      period: 'Feb 2026 — Present',  imageUrl: 'assets/experiences/daydayup/bj2.jpeg' },
      { index: '#2', company: '北京',       role: 'The Wizarding World of Harry Potter - USBJ',  period: 'May 2025 — Aug 2025', imageUrl: 'assets/experiences/daydayup/bj3.jpeg' },
      { index: '#3', company: '北京',      role: 'CHITEC Expo with Founder of Abillion, Vikas Garg', imageUrl: 'assets/experiences/daydayup/bj1.jpg' },
      { index: '#4', company: '北京', role: 'The Great Wall of China',    period: 'Dec 2024 — Jan 2025', imageUrl: 'assets/experiences/daydayup/bj4.jpeg' },
      { index: '#5', company: '北京',               role: 'Nanluoguxiang',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/bj5.jpeg' },
      { index: '#6', company: '北京',               role: 'Tsinghua University',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/bj6.jpeg' },
      { index: '#7', company: '北京',               role: 'Celebrated birthday! 01.06',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/bj7.jpeg' },
      { index: '#8', company: '天津',               role: 'Tianjin Eye',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/tj1.jpeg' },
      { index: '#9', company: '天津',               role: 'Tianjin Haihe River Waterfront',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/tj2.jpeg' },
      { index: '#10', company: '洛阳',               role: 'Stepping into History - donning a traditional Hanfu in Luoyang',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ly1.jpeg' },
      { index: '#11', company: '洛阳',               role: '簪花 (Zanhua)',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ly2.jpeg' },
      { index: '#12', company: '洛阳',               role: 'Luoyi Ancient City',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ly3.jpeg' },
      { index: '#13', company: '洛阳',               role: 'Longmen Grottoes',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ly4.jpeg' },
      { index: '#14', company: '唐山',               role: '打铁花(Iron Flower) Performance',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ts1.jpeg' },
      { index: '#15', company: '唐山',               role: 'Tangshan Hetou Old Street',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/ts2.jpeg' },
      { index: '#16', company: '青岛',               role: 'Tsingtao Beer Museum',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/qd1.jpeg' },
      { index: '#17', company: '青岛',               role: 'Qingdao Olympic Sailing and Marine Culture',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/qd2.jpeg' },
      { index: '#18', company: '青岛',               role: 'Zhanqiao Pier',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/qd3.jpeg' },
      { index: '#19', company: '丽江',               role: 'Jade Dragon Snow Mountain',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/lj2.jpeg' },
      { index: '#20', company: '丽江',               role: 'Prepping oxygen tanks!',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/lj3.jpeg' },
      { index: '#21', company: '丽江',               role: 'Yunnan Crossing the Bridge Noodles (过桥米线)',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/lj4.jpeg' },
      { index: '#22', company: '丽江',               role: 'Blue Moon Valley',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/lj5.jpeg' },
      { index: '#23', company: '虎跳峡',               role: 'Tiger Leaping Gorge',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/htx1.jpeg' },
      { index: '#24', company: '香格里拉',               role: 'Shangri-La',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/xgll1.jpeg' },
      { index: '#25', company: '香格里拉',               role: 'Trying out Tibetan costume!',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/xgll2.jpeg' },
      { index: '#26', company: '香格里拉',               role: 'Shangri-La Giant Prayer Wheel',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/xgll3.jpeg' },
      { index: '#27', company: '香格里拉',               role: 'Tibetan Large Prayer Flags',         period: 'May — Aug 2023',      imageUrl: 'assets/experiences/daydayup/xgll4.jpeg' },
    ];

    const R = 800; // arc radius in px

    /* ── Build DOM ── */
    const stage  = document.getElementById('carouselStage');
    const dotsEl = document.getElementById('dots');

    CARDS.forEach((data, i) => {
      /* Card */
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = i;
      card.innerHTML = `
        <div class="card-image">
          ${data.imageUrl ? `<img src="${data.imageUrl}" alt="${data.company}" />` : ''}
        </div>
      `;
      card.addEventListener('click', () => {
        const target = parseInt(card.dataset.index);
        if (target !== activeIndex) {
          const prev  = activeIndex;
          activeIndex = target;
          updateCarousel();
          updateDescription(prev);
        }
      });
      stage.appendChild(card);

      /* Dot */
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.addEventListener('click', () => {
        const prev  = activeIndex;
        activeIndex = i;
        updateCarousel();
        updateDescription(prev);
      });
      dotsEl.appendChild(dot);
    });

    /* ── State ── */
    let activeIndex = 0;
    const total = CARDS.length;

    /* ── Transform math (exact from spec) ── */
    function getCardTransform(offset) {
      const angle = offset * 30 * (Math.PI / 180); // 30deg per step
      const tx = R * Math.sin(angle);
      const tz = R * (1 - Math.cos(angle));   // positive = toward viewer
      const ty = Math.abs(offset) * -22;       // side cards rise slightly
      const ry = -angle * (180 / Math.PI);    // face inward
      const scale   = 1 - Math.abs(offset) * 0.11;
      const opacity = 1 - Math.abs(offset) * 0.28;
      const zIndex  = 10 - Math.abs(offset) * 2;

      return { tx, ty, tz, ry, scale, opacity, zIndex };
    }

    /* ── Update carousel transforms ── */
    function updateCarousel() {
      const cards = document.querySelectorAll('.card');
      cards.forEach((card, i) => {
        card.classList.toggle('active', i === activeIndex);
        let offset = i - activeIndex;
        // Wrap offset so cards loop circularly (shortest path around the circle)
        if (offset > total / 2)  offset -= total;
        if (offset < -total / 2) offset += total;

        if (Math.abs(offset) > 2) {
          // Snap instantly off-screen — no transition so the card never flies past
          card.style.transition    = 'none';
          const edgeOffset         = offset > 0 ? 2 : -2;
          const { tx, ty, tz, ry, scale } = getCardTransform(edgeOffset);
          card.style.transform     = `translateX(${tx}px) translateY(${ty}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`;
          card.style.opacity       = '0';
          card.style.zIndex        = '0';
          card.style.pointerEvents = 'none';
          return;
        }

        // Restore CSS transition for visible cards
        card.style.transition    = '';
        const { tx, ty, tz, ry, scale, opacity, zIndex } = getCardTransform(offset);
        card.style.transform     = `translateX(${tx}px) translateY(${ty}px) translateZ(${tz}px) rotateY(${ry}deg) scale(${scale})`;
        card.style.opacity       = opacity;
        card.style.zIndex        = zIndex;
        card.style.pointerEvents = 'auto';
        card.style.cursor        = offset === 0 ? 'default' : 'pointer';
      });

      /* Update dots */
      document.querySelectorAll('.dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === activeIndex);
      });
    }

    /* ── Update description text ── */
    const dynamicDesc = document.getElementById('dynamicDesc');
    const descLabel   = document.getElementById('descLabel');
    const descRole    = document.getElementById('descRole');
    dynamicDesc.style.transition = 'opacity 0.22s ease, transform 0.22s ease';

    function updateDescription(prevIdx) {
      const data     = CARDS[activeIndex];
      const prevData = prevIdx !== undefined ? CARDS[prevIdx] : null;
      const titleChanged = !prevData || prevData.company !== data.company;

      if (titleChanged) {
        /* Title changed — fade the whole block */
        dynamicDesc.style.opacity   = '0';
        dynamicDesc.style.transform = 'translateY(8px)';
        setTimeout(() => {
          descLabel.textContent = data.company;
          descRole.textContent  = data.role;
          dynamicDesc.style.opacity   = '1';
          dynamicDesc.style.transform = 'translateY(0)';
        }, 200);
      } else {
        /* Same title — only fade the subtitle */
        descRole.style.opacity   = '0';
        descRole.style.transform = 'translateY(6px)';
        setTimeout(() => {
          descRole.textContent       = data.role;
          descRole.style.opacity     = '1';
          descRole.style.transform   = 'translateY(0)';
        }, 180);
      }
    }

    /* ── Navigation ── */
    document.querySelector('.carousel-prev').addEventListener('click', () => {
      const prev = activeIndex;
      activeIndex = (activeIndex - 1 + total) % total;
      updateCarousel();
      updateDescription(prev);
    });

    document.querySelector('.carousel-next').addEventListener('click', () => {
      const prev = activeIndex;
      activeIndex = (activeIndex + 1) % total;
      updateCarousel();
      updateDescription(prev);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft')  document.querySelector('.carousel-prev').click();
      if (e.key === 'ArrowRight') document.querySelector('.carousel-next').click();
    });

    /* ── Swipe / trackpad drag ── */
    const scene = document.getElementById('carouselScene') || document.querySelector('.carousel-scene');
    let dragStartX = null;
    let dragging   = false;

    function navigate(dir) {
      const prev = activeIndex;
      activeIndex = (activeIndex + dir + CARDS.length) % CARDS.length;
      updateCarousel();
      updateDescription(prev);
    }

    // Touch (mobile + trackpad on some browsers)
    scene.addEventListener('touchstart', e => {
      dragStartX = e.touches[0].clientX;
    }, { passive: true });

    scene.addEventListener('touchend', e => {
      if (dragStartX === null) return;
      const dx = e.changedTouches[0].clientX - dragStartX;
      if (Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1);
      dragStartX = null;
    }, { passive: true });

    // Mouse drag (trackpad two-finger swipe shows as mousemove on some setups)
    scene.addEventListener('mousedown', e => {
      dragStartX = e.clientX;
      dragging   = true;
    });

    window.addEventListener('mouseup', e => {
      if (!dragging) return;
      const dx = e.clientX - dragStartX;
      if (Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1);
      dragging   = false;
      dragStartX = null;
    });

    // Wheel (horizontal swipe on trackpad only — ignore vertical scroll)
    let wheelLock = false;
    scene.addEventListener('wheel', e => {
      const isHorizontal = Math.abs(e.deltaX) > Math.abs(e.deltaY);
      if (!isHorizontal) return;   // let vertical scroll pass through normally
      e.preventDefault();          // block browser back/forward swipe
      if (wheelLock) return;
      if (Math.abs(e.deltaX) < 20) return;
      navigate(e.deltaX > 0 ? 1 : -1);
      wheelLock = true;
      setTimeout(() => { wheelLock = false; }, 500);
    }, { passive: false });

    /* ── Init ── */
    // Set initial description without animation
    descLabel.textContent = CARDS[activeIndex].company;
    descRole.textContent  = CARDS[activeIndex].role;
    updateCarousel(); // run on load
  </script>
</body>
</html>
